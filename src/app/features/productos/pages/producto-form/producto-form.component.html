<div class="form-card">

  <div class="form-header">
    <h2>Nuevo Producto</h2>
    <p>Registrar un nuevo producto en el catálogo</p>
  </div>

  <form [formGroup]="form">

    <div class="form-group">
      <label>Código</label>
      <input type="text" formControlName="codigo" placeholder="Ej. PROD-001">
    </div>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="nombre" placeholder="Nombre del producto">
    </div>

    <div class="form-group">
      <label>Descripción</label>
      <textarea rows="4" formControlName="descripcion" placeholder="Descripción del producto">
      </textarea>
    </div>

    <div class="form-group">
      <label>Precio</label>
      <input type="number" formControlName="precio">
    </div>

    <div class="actions">

      <button type="button" class="btn-primary" (click)="save()">

        Guardar

      </button>

      <button type="button" class="btn-secondary" (click)="cancelar()">

        Cancelar

      </button>

    </div>

  </form>

</div>
