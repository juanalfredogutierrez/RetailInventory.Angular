<div
  class="ui-card"
  [class.padding-none]="padding() === 'none'"
  [class.padding-sm]="padding() === 'sm'"
  [class.padding-md]="padding() === 'md'"
  [class.padding-lg]="padding() === 'lg'"

  [class.shadow-none]="shadow() === 'none'"
  [class.shadow-sm]="shadow() === 'sm'"
  [class.shadow-md]="shadow() === 'md'"
  [class.shadow-lg]="shadow() === 'lg'"

  [class.variant-outlined]="variant() === 'outlined'"
  [class.variant-filled]="variant() === 'filled'">

  @if(title()){

  <div class="ui-card-header">

    <h3>{{title()}}</h3>

    @if(subtitle()){

    <p>{{subtitle()}}</p>

    }

  </div>

  }

  <div class="ui-card-content">

    <ng-content></ng-content>

  </div>

</div>
